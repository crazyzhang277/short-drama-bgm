<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自动配背景音乐</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-dot"></span><div><strong>自动配背景音乐</strong><small>本地运行 · 可恢复</small></div></div>
      <nav class="primary-nav" aria-label="主导航">
        <button class="nav-item active" data-action="set-view" data-view="desk"><span class="nav-index">01</span><span><b>批次控制台</b><small>批次控制台</small></span></button>
        <button class="nav-item" data-action="set-view" data-view="timeline"><span class="nav-index">02</span><span><b>时间轴</b><small>单集时间轴</small></span></button>
        <button class="nav-item" data-action="set-view" data-view="transcript"><span class="nav-index">03</span><span><b>对白审阅</b><small>转录审阅</small></span></button>
        <button class="nav-item" data-action="set-view" data-view="settings"><span class="nav-index">04</span><span><b>设置</b><small>输出与常用项</small></span></button>
        <button class="nav-item" data-action="set-view" data-view="about"><span class="nav-index">05</span><span><b>关于</b><small>版本与开源说明</small></span></button>
      </nav>
      <div class="sidebar-note">
        <span class="eyebrow">交付提醒</span>
        <strong>自动成片 · 仍需试听</strong><p>软件会输出保留原画面、原声音轨并混入背景音乐的最终成片；关键词情绪与混音听感仍建议人工复核。</p>
      </div>
      <div class="sidebar-foot"><span class="pulse-dot"></span><span id="sidebar-runtime">离线链路待启动</span></div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>工作台</span><i>/</i><strong id="top-title">批次控制台</strong></div>
        <div class="top-actions"><span class="offline-badge"><span class="pulse-dot"></span>本地 · 离线</span><button class="icon-button" title="刷新" data-action="refresh">↻</button><button class="icon-button" title="最大化 / 还原" aria-label="最大化或还原工作台" data-action="toggle-maximize">⛶</button><button class="button primary compact" data-action="start" id="top-start">开始批次</button></div>
      </header>
      <div id="screen" class="screen" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./renderer.js"></script>
</body>
</html>
